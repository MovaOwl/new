<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Словопад</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Russo+One&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-screen game (HUD · falling field · 2×2 answers) + full-screen hub with five tabs.
   Theme: words are bricks — brick accent for progress, blueprint blue for actions. */
:root{
  --bg:#edf0f5; --panel:#ffffff; --panel2:#f5f7fb; --line:#dbe1ec; --ink:#172033; --muted:#5d6880;
  --brick:#cf5a26; --brick-ink:#ffffff; --brick-soft:#f6e1d6;
  --blue:#2459d6; --blue-hover:#1b47ad; --blue-ink:#ffffff;
  --ok:#1b9a66; --bad:#d23f3a; --gold:#d99a1d; --shade:rgba(15,22,38,.5);
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131e; --panel:#161d2c; --panel2:#1c2436; --line:#2a3550; --ink:#e8ecf4; --muted:#8e9ab5;
  --brick:#ec7a42; --brick-ink:#1b0d05; --brick-soft:#3a2418;
  --blue:#4a7df0; --blue-hover:#6290f5; --blue-ink:#ffffff;
  --ok:#2bb67c; --bad:#e8574f; --gold:#f0b440; --shade:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131e; --panel:#161d2c; --panel2:#1c2436; --line:#2a3550; --ink:#e8ecf4; --muted:#8e9ab5;
  --brick:#ec7a42; --brick-ink:#1b0d05; --brick-soft:#3a2418;
  --blue:#4a7df0; --blue-hover:#6290f5; --blue-ink:#ffffff;
  --ok:#2bb67c; --bad:#e8574f; --gold:#f0b440; --shade:rgba(0,0,0,.62); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* ---------- game screen ---------- */
#game{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.hud{display:flex;align-items:center;gap:10px}
.lvbadge{width:46px;height:46px;flex:none;border:0;border-radius:12px;background:var(--brick);color:var(--brick-ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.lvbadge small{font-size:9px;font-weight:700;letter-spacing:.08em;opacity:.85}
.lvbadge b{font-family:var(--display);font-weight:400;font-size:19px}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hud-top{display:flex;gap:6px;align-items:baseline;font-size:13px;min-width:0}
.hud-top b{font-weight:700;white-space:nowrap}
.hud-top span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brick);border-radius:4px;transition:width .4s}
.bar.ok i{background:var(--ok)} .bar.blue i{background:var(--blue)}
.hud-sub{font-size:11px;color:var(--muted)}
.combo{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1;padding:5px 8px;border-radius:10px;background:var(--brick-soft);color:var(--brick)}
.combo b{font-family:var(--display);font-weight:400;font-size:17px}
.combo span{font-size:10px;font-weight:700}
.ibtn{width:42px;height:42px;flex:none;border-radius:12px;border:0;background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.ibtn svg{width:20px;height:20px}

#field{position:relative;flex:1;min-height:0;background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden;transition:box-shadow .3s}
#field.hot{box-shadow:0 0 0 2px var(--brick),0 0 22px -6px var(--brick)}
.rule{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.rule span{position:absolute;left:8px;top:2px;font-size:10px;color:var(--muted)}
.ftag{position:absolute;right:10px;top:8px;font-size:11px;color:var(--muted);max-width:60%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drop{position:absolute;left:50%;top:0;transform:translate(-50%,0);will-change:transform;display:flex;align-items:center;gap:10px;white-space:nowrap}
#drop.ph{width:90%;justify-content:center;white-space:normal}
.dw.ph{font-family:var(--body);font-weight:700;font-size:19px;line-height:1.25}
.card .en.ph{font-family:var(--body);font-weight:700;font-size:23px;line-height:1.25}
.keys{font-size:12px;opacity:.9}
.pts{min-width:36px;height:36px;padding:0 6px;border-radius:18px;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.pts.low{background:var(--gold);color:#241500} .pts.zero{background:var(--bad)}
.dbox{display:flex;flex-direction:column;gap:4px}
.dw{font-family:var(--display);font-size:25px;line-height:1.1}
.dw.ru{font-family:var(--body);font-weight:700;font-size:22px}
.dmeta{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dmeta .bar{width:60px;height:5px}
.listen{display:flex;align-items:center;gap:8px;border:0;background:var(--blue);color:var(--blue-ink);border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer}
.listen svg{width:18px;height:18px}

#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{min-height:60px;border:0;border-radius:12px;background:var(--blue);color:var(--blue-ink);font:600 15px/1.2 var(--body);padding:8px;cursor:pointer;touch-action:manipulation;word-break:break-word}
.ans:hover{background:var(--blue-hover)}
.ans:disabled{opacity:.5;cursor:default}
.ans.right{background:var(--ok);opacity:1} .ans.wrong{background:var(--bad);opacity:1}

/* cards over the field */
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:var(--shade)}
.card{width:100%;max-width:380px;border-radius:18px;padding:20px 18px 16px;color:#fff;text-align:center;display:flex;flex-direction:column;gap:9px;box-shadow:0 18px 40px rgba(0,0,0,.28);animation:pop .2s ease-out}
.card.new{background:var(--blue)} .card.ok{background:var(--ok)} .card.bad{background:var(--bad)} .card.info{background:var(--panel);color:var(--ink)}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:700}
.card .en{font-family:var(--display);font-size:32px;line-height:1.1;word-break:break-word}
.card .ru{font-size:19px;font-weight:600;line-height:1.3}
.card .hint{font-size:13px;opacity:.9;line-height:1.4}
.card .cbar{height:7px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.card .cbar i{display:block;height:100%;background:#fff;border-radius:4px}
.card .xpline{display:flex;justify-content:center;gap:12px;font-size:13px;font-weight:700}
.card .row{display:flex;gap:8px;margin-top:4px}
.pill{flex:1;border:0;border-radius:12px;padding:13px 10px;font:600 15px var(--body);cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
.pill.main{background:#fff;color:#172033}
.card.info .pill.main{background:var(--blue);color:var(--blue-ink)}
.speak{align-self:center;border:0;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;font:600 13px var(--body);cursor:pointer;color:#fff;display:flex;gap:6px;align-items:center}
.speak svg{width:15px;height:15px}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}

/* ---------- hub ---------- */
#hub{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 12px 6px}
.tab{border:0;background:none;border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--body);color:var(--muted);cursor:pointer}
.tab svg{width:21px;height:21px}
.tab.on{background:var(--panel);color:var(--brick);box-shadow:0 0 0 1px var(--line)}
.hub-body{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 16px;display:flex;flex-direction:column;gap:12px}
.hub-body>*{flex:none}
.hub-foot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel{display:flex;flex-direction:column;gap:3px;min-width:0}
.sel label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{width:100%;border:0;border-radius:10px;background:var(--panel);box-shadow:0 0 0 1px var(--line);padding:10px;font:500 14px var(--body);color:var(--ink)}
.play{border:0;border-radius:14px;background:var(--brick);color:var(--brick-ink);font:400 19px var(--display);padding:15px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}

.block{background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.block h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-wrap:balance}
.block h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.block p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.muted{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;border-radius:10px;padding:9px 8px;font:500 13px var(--body);background:var(--panel2);box-shadow:0 0 0 1px var(--line);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--brick);color:var(--brick-ink);box-shadow:none;font-weight:700}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* passport */
.pp{background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.pp-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--brick);color:var(--brick-ink)}
.pp-k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.pp-no{font-family:var(--display);font-size:16px}
.pp-stamp{border:2px solid currentColor;border-radius:8px;padding:4px 8px;font-family:var(--display);font-size:15px;transform:rotate(-4deg)}
.pp-pic{line-height:0;border-bottom:1px solid var(--line)}
.pp-pic svg{width:100%;height:auto;display:block}
.pp-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pp-type{font-family:var(--display);font-size:22px;line-height:1.15;text-wrap:balance}
.owner{border:0;background:none;padding:0;cursor:pointer;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;text-align:left}
.owner b{color:var(--ink)} .owner svg{width:14px;height:14px}
.owner-in{border:0;border-radius:8px;box-shadow:0 0 0 1px var(--line);background:var(--panel2);padding:7px 9px;font:600 14px var(--body);color:var(--ink);width:100%}
.xprow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:8px}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin:0;box-shadow:0 0 0 1px var(--line)}
.pp-grid div{background:var(--panel2);padding:10px 12px;min-width:0}
.pp-grid dt{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pp-grid dd{margin:3px 0 0;font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-grid small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stats{display:flex;flex-direction:column;gap:9px}
.stat{display:grid;grid-template-columns:86px 1fr 52px 26px;gap:8px;align-items:center;font-size:13px}
.stat .v{text-align:right;font-weight:700}
.grade{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff}
.g-E{background:#8a93a6}.g-D{background:#4f8f6a}.g-C{background:#2f86c9}.g-B{background:#7b5cd6}.g-A{background:#d99a1d}.g-S{background:#cf3d36}
.act{display:flex;align-items:flex-end;gap:4px;height:84px}
.act .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.act .d i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--brick);min-height:2px}
.act .d.zero i{background:var(--line)}
.act .d span{font-size:9px;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ach{background:var(--panel2);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;box-shadow:0 0 0 1px var(--line)}
.ach .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:13px;background:var(--brick);color:var(--brick-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ach b{font-size:12px;line-height:1.2}
.ach span{font-size:10px;color:var(--muted);line-height:1.3}
.ach.off{opacity:.55} .ach.off .ic{background:var(--line);color:var(--muted);box-shadow:none}

/* plan */
.streak{display:flex;align-items:center;gap:14px}
.streak .big{font-family:var(--display);font-size:44px;color:var(--brick);line-height:1}
.quest{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:center}
.qtop b{font-weight:600}
.qtop span{font-size:12px;color:var(--muted);white-space:nowrap}
.quest.done .qtop b{color:var(--ok)}
.check{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;margin-right:6px;vertical-align:-3px}
.check svg{width:11px;height:11px}
.warn{background:var(--brick-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.btn{border:0;border-radius:12px;background:var(--blue);color:var(--blue-ink);font:600 15px var(--body);padding:12px 14px;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn.danger{background:none;color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
ol.rules{margin:0;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
ol.rules b{color:var(--ink)}

/* words */
.search{width:100%;border:0;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line);padding:12px 14px;font:500 15px var(--body);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:0;border-radius:20px;padding:7px 12px;font:600 12px var(--body);background:var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.wlist{background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.wrow{width:100%;border:0;background:none;display:grid;grid-template-columns:1fr 1fr 54px;gap:8px;align-items:center;padding:11px 14px;text-align:left;cursor:pointer;border-top:1px solid var(--line);font-size:14px}
.wrow:first-child{border-top:0}
.wrow .we{font-weight:700;min-width:0;overflow-wrap:anywhere}
.wrow .wr{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.wrow .bar{height:5px}
.wdet{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.wdet .btnrow .btn{padding:9px 10px;font-size:13px}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:right}
.more{border:0;background:none;color:var(--blue);font:600 14px var(--body);padding:12px;cursor:pointer;width:100%}

textarea{width:100%;min-height:170px;border:0;border-radius:12px;background:var(--panel2);box-shadow:0 0 0 1px var(--line);padding:12px;font:13px/1.45 var(--body);color:var(--ink);resize:vertical}
.field-in{width:100%;border:0;border-radius:10px;background:var(--panel2);box-shadow:0 0 0 1px var(--line);padding:11px 12px;font:600 15px var(--body);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.sw{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}

/* modal + toasts */
#modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--shade)}
.mcard{width:100%;max-width:400px;background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .25s ease-out;text-align:center}
.mcard .mh{background:var(--brick);color:var(--brick-ink);padding:16px;display:flex;flex-direction:column;gap:2px}
.mcard .mh small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.mcard .mh b{font-family:var(--display);font-weight:400;font-size:48px;line-height:1}
.mcard .mpic{line-height:0} .mcard .mpic svg{width:100%;height:auto}
.mcard .mb{padding:16px;display:flex;flex-direction:column;gap:10px}
.mcard .mb h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px;text-wrap:balance}
.mcard .mb p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
#toasts{position:absolute;left:0;right:0;top:64px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:9px 14px;border-radius:20px;max-width:100%;text-align:center;animation:pop .2s;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.ach{background:var(--brick);color:var(--brick-ink)}
.toast.ok{background:var(--ok);color:#fff}

/* house scene */
.smoke{animation:rise 3.2s linear infinite;transform-box:fill-box;transform-origin:center}
.smoke.s2{animation-delay:1.1s}.smoke.s3{animation-delay:2.2s}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translate(10px,-34px) scale(1.6);opacity:0}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

/* word sheet */
#sheet{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
.sh-top{display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.sh-top .back{border:0;background:var(--panel);box-shadow:0 0 0 1px var(--line);border-radius:12px;padding:10px 14px;font:600 14px var(--body);cursor:pointer}
.sh-top .sp2{margin-left:auto}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:12px}
.sh-body>*{flex:none}
.sh-head{display:flex;flex-direction:column;gap:4px}
.sh-en{font-family:var(--display);font-size:34px;line-height:1.1;overflow-wrap:anywhere}
.sh-en.ph{font-family:var(--body);font-weight:700;font-size:26px}
.sh-phon{color:var(--muted);font-size:15px;min-height:1em}
.sh-ru{font-size:20px;font-weight:600}
.sh-meta{font-size:12px;color:var(--muted)}
.ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}

function addXP(n) {
  const a = lv().L; S.xp += Math.max(0, Math.round(n)); const b = lv().L;
  if (b > a) MQ.push({ t: 'lvl', L: b });
}

function qAdd(id, v, isMax) {
  const q = S.q; q[id] = isMax ? Math.max(q[id] || 0, v) : (q[id] || 0) + v;
  const Q = QUESTS.find(x => x.id === id), g = Q.g();
  if (g > 0 && !q.done[id] && q[id] >= g) { q.done[id] = 1; addXP(Q.xp); toast(`План: «${Q.n}» — готово · +${Q.xp} XP`, 'ok'); sfx('ach'); }
  const act = QUESTS.filter(x => x.g() > 0);
  if (!q.all && act.every(x => q.done[x.id])) { q.all = true; S.planN++; addXP(250); MQ.push({ t: 'plan' }); }
}

  toast(`Серия: ${S.streak} ${pl(S.streak, 'день', 'дня', 'дней')} подряд`, 'ok');
}

function say(t, force) {
  if (!S.sound && !force) return;
  if (window.Android) { try { Android.speak(t); } catch (e) {} return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}

let AC = null;
function sfx(type) {
  if (!S.sfx) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, .06], [990, .1]], bad: [[200, .09], [150, .16]], lvl: [[523, .1], [659, .1], [784, .1], [1047, .3]], ach: [[880, .08], [1320, .14]], new: [[520, .07]] }[type];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(type === 'bad' ? .06 : .16, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    });
  } catch (e) {}
}

    s += `<path d="M236 188 V172 a32 16 0 0 1 64 0 V188Z" fill="#d6f0ff" opacity=".75" stroke="#fff" stroke-width="1.2"/><path d="M252 188 V160 M268 188 V157 M284 188 V160" stroke="#fff" stroke-width="1"/><circle cx="246" cy="182" r="3" fill="#3d9a4a"/><circle cx="262" cy="182" r="3" fill="#d94a3a"/><circle cx="278" cy="182" r="3" fill="#3d9a4a"/><circle cx="292" cy="182" r="3" fill="#d94a3a"/>`;
  }
  if (S(6)) {
    let f = '';
    for (let x = 4; x < 318; x += 7) { if (x > 150 && x < 172) continue; f += `<path d="M${x} 163 V153 l2.5 -3 l2.5 3 V163Z" fill="${night ? '#8a6a48' : '#c99a62'}"/>`; }

  return s + '</svg>';
}

const ansBtns = [0, 1, 2, 3].map(i => $('a' + i));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let cur = null, opts = [], t0 = 0, elapsed = 0, raf = 0, running = false, lastEn = '', combo = 0, paused = true, started = false, autoT = 0;

(function rules() {
  const f = $('field');
  [100, 80, 60, 40, 20].forEach((v, i) => { const d = document.createElement('div'); d.className = 'rule'; d.style.top = (i * 20 + 4) + '%'; d.innerHTML = `<span>${v}</span>`; f.insertBefore(d, $('drop')); });
})();

function renderHud() {
  const { L, x, n } = lv(), sg = stageOf(nBricks());
  $('hudLv').textContent = L; $('hudName').textContent = S.name; $('hudStage').textContent = STAGES[sg].t;

  $('combo').hidden = combo < 3; $('comboN').textContent = combo; $('comboM').textContent = '×' + (1 + Math.min(combo, 20) * .05).toFixed(2);
  $('field').classList.toggle('hot', combo >= 10);
  $('ftag').textContent = `${MODES.find(m => m.id === S.mode).n} · ${curSet().n}`;
}

function step() {
  rollDay(); renderHud(); clearAns();
  if (MQ.length) return showModal(step);
  const mode = S.mode; let pool;
  if (mode === 'errors') {
    pool = hardList().slice(0, 12);
    if (!pool.length) return info('Трудных слов нет', 'Трудными становятся слова, на которых ты ошибся хотя бы два раза. Пока чисто.');
  } else if (mode === 'phrases') {
    const U = pUnlocked();
    if (!U.length) return info('Фраз пока нет', 'Фраза открывается, когда все её слова тебе известны и хотя бы одно из них ты выучил в игре. Выучи несколько слов — и пойдут фразы с ними.');
    const Dp = U.filter(p => { const r = S.w[p.k]; return r && r.s === 2 && r.n && r.n <= S.day; }), Lp = U.filter(p => st(p.k) === 1), Np = U.filter(p => st(p.k) === 0).sort((a, b) => pFresh(b) - pFresh(a));
    if (Lp.length < ACTIVE && Np.length && Dp.length < 20) return newCard(Np[0]);
    pool = Dp.length && (!Lp.length || Math.random() < .4) ? Dp : Lp;
    if (!pool.length) pool = U.filter(p => st(p.k) === 2);
    if (!pool.length) return info('Все фразы пройдены', 'Учи новые слова — откроются новые фразы.');
  } else if (mode === 'review') {
    pool = dueList(); if (!pool.length) pool = learnedList();
    if (!pool.length) return info('Повторять пока нечего', 'Сначала выучи хотя бы одно слово в обычном режиме.');
  } else {
    const L = learningList(), D = dueList(), nw = nextNew();
    if (L.length < ACTIVE && nw && D.length < 20) return newCard(nw);
    pool = D.length && (!L.length || Math.random() < .4) ? D : L;
    if (!pool.length) pool = learnedList();
    if (!pool.length) return info('Набор пройден', 'В этом наборе все слова уже в базе. Выбери другой набор.');
  }
  let cand = pool.filter(w => w.en !== lastEn); if (!cand.length) cand = pool;
  const w = cand[Math.random() * cand.length | 0], r = rec(K(w));
  let rev = S.dir === 'ru' ? true : S.dir === 'mix' ? (r.s === 2 || r.m >= mx(w) / 2) && Math.random() < .5 : false;
  if (mode === 'listen') rev = false;
  drop(w, rev);
}

function newCard(w) {
  overlay(`<div class="card new"><div class="k">${w.ph ? 'Новая фраза открыта' : `Новое слово · №${w.i + 1} по частоте`}</div><div class="en${w.ph ? ' ph' : ''}">${esc(w.en)}</div><div class="ru">${esc(w.ru)}</div>
    <div class="row" style="justify-content:center;gap:8px"><button class="speak" id="sp">${SPK}Произношение</button><button class="more-btn" id="moreInfo">Подробнее</button></div>
    <div class="hint">${w.ph ? `Собрана из твоих слов: ${esc(w.keys.join(', '))}` : 'Набор: ' + esc(curSet().n)}</div>
    <div class="row"><button class="pill" id="knowBtn">Уже знаю</button><button class="pill main" id="learnBtn">Учить</button></div></div>`);
  say(w.en); sfx('new');
  $('sp').onclick = () => say(w.en, true);
  $('moreInfo').onclick = () => openInfo(w);
  $('knowBtn').onclick = () => { const r = rec(K(w)); r.s = 3; r.t = Date.now(); if (!w.ph) { toast('+1 кирпич в стройку', 'ok'); checkBuild(); checkAch(); } save(); closeOv(); step(); };
  $('learnBtn').onclick = () => {
    const r = rec(K(w)); r.s = 1; r.m = 0;
    if (!w.ph) { S.todayNew++; today().n++; qAdd('newW', 1); if (S.todayNew === S.goal) toast('Дневная норма новых слов взята', 'ok'); }

  };

function info(title, text) {
  overlay(`<div class="card info"><div class="en" style="font-size:24px">${esc(title)}</div><div class="hint muted">${esc(text)}</div><div class="row"><button class="pill main" id="toHub">К меню</button></div></div>`);
  $('toHub').onclick = () => { closeOv(); openHub(); };

const SPK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function pickOthers(w, n) {
  if (w.ph) { const U = pUnlocked(), src = U.length > 12 ? U : P, out = [], seen = new Set([w.ru, w.en]); let g = 0;
    while (out.length < n && g++ < 300) { const pool = Math.random() < .75 ? src : P, x = pool[Math.random() * pool.length | 0]; if (seen.has(x.ru) || seen.has(x.en)) continue; seen.add(x.ru); seen.add(x.en); out.push(x); }
    return out; }
  const src = curSet().words.length > 30 ? curSet().words : W, out = [], seen = new Set([w.ru, w.en]);
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const pool = Math.random() < .7 ? src : W, x = pool[Math.random() * pool.length | 0];
    if (seen.has(x.ru) || seen.has(x.en)) continue; seen.add(x.ru); seen.add(x.en); out.push(x);
  }
  return out;
}

function drop(w, rev) {
  const listen = S.mode === 'listen';
  cur = { w, rev, listen }; lastEn = w.en;
  opts = shuffle([w, ...pickOthers(w, 3)]);
  ansBtns.forEach((b, i) => { b.textContent = rev ? opts[i].en : opts[i].ru; b.disabled = false; b.className = 'ans'; });
  const r = rec(K(w));
  const tag = r.s === 2 ? `повтор · ${r.iv} дн.` : `${w.ph ? 'фраза' : 'слово'} ${r.m}/${mx(w)}`;
  const head = listen ? `<button class="listen" id="relisten">${SPK}Слушай</button>` : `<div class="dw${rev ? ' ru' : ''}${w.ph ? ' ph' : ''}">${esc(rev ? w.ru : w.en)}</div>`;
  $('drop').classList.toggle('ph', !!w.ph);
  $('drop').innerHTML = `<div class="pts num" id="pts">100</div><div class="dbox">${head}<div class="dmeta">${rev ? 'ru → en · ' : ''}${tag}<div class="bar ${r.s === 2 ? 'ok' : ''}"><i style="width:${r.s === 2 ? 100 : r.m / mx(w) * 100}%"></i></div></div></div>`;
  if (listen) $('relisten').onclick = () => say(w.en, true);
  else { const dw = $('drop').querySelector('.dw'); dw.classList.add('dwbtn'); dw.onclick = () => openInfo(w); }
  $('drop').hidden = false;
  elapsed = 0; t0 = performance.now(); running = true;
  if (!rev) say(w.en, listen);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}

function tick(now) {
  if (!running) return;
  const dur = SPEEDS[S.speed].d * 1000 * (cur.listen ? 1.25 : 1);
  const p = Math.min(1, (elapsed + now - t0) / dur);
  const f = $('field'), d = $('drop');
  d.style.transform = `translate(-50%, ${8 + p * (f.clientHeight - d.offsetHeight - 16)}px)`;
  const pts = Math.round(100 * (1 - p)), el = $('pts');
  el.textContent = pts; el.className = 'pts num' + (pts === 0 ? ' zero' : pts < 40 ? ' low' : '');
  if (p >= 1) return judge(-1);
  raf = requestAnimationFrame(tick);
}

function judge(i) {
  if (!running || !cur) return;
  running = false; cancelAnimationFrame(raf);
  const now = performance.now(), rt = elapsed + now - t0;
  const { w, rev } = cur, r = rec(K(w)), M = mx(w), right = opts.indexOf(w), ok = i === right;
  const pts = ok ? Math.max(5, +$('pts').textContent) : 0, was = r.s;
  ansBtns.forEach((b, k) => { b.disabled = true; if (k === right) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
  $('drop').hidden = true;
  S.answered++; today().a++;
  let gain = 0, note = '', progress = '';
  if (ok) {
    combo++; S.bestCombo = Math.max(S.bestCombo, combo); S.correct++; today().c++; S.rtSum += rt; S.rtN++;
    if (pts >= 95) S.fastN++;
    if (new Date().getHours() < 5) S.owl = true;
    const mult = 1 + Math.min(combo, 20) * .05;
    gain = (3 + pts * .2) * mult;
    if (r.s === 1) {
      r.m = Math.min(M, r.m + pts);
      if (r.m >= M && w.ph) { r.s = 2; r.iv = 1; r.n = dAdd(1); gain += 25; note = 'Фраза выучена! Первый повтор — завтра'; }
      else if (r.m >= M) {
        r.s = 2; r.iv = 1; r.n = dAdd(1); gain += 40; note = 'Слово выучено! +1 кирпич в стройку. Первый повтор — завтра';
        r.t = Date.now(); checkBuild();
        const opened = P.filter(p => p.keys.includes(w.en) && pOpen(p)).length;
        if (opened) setTimeout(() => toast(`Открыто новых фраз: ${opened} — режим «Фразы»`, 'ach'), 400);
      }
      else { const left = Math.ceil((M - r.m) / Math.max(pts, 40)); note = `Прогресс ${w.ph ? 'фразы' : 'слова'} +${pts}. Ещё примерно ${left} ${pl(left, 'попадание', 'попадания', 'попаданий')}`; }
      progress = `<div class="cbar"><i style="width:${r.m / M * 100}%"></i></div>`;
    } else if (r.s === 2) {
      if (r.n && r.n <= S.day) { const k = INTERVALS.indexOf(r.iv); r.iv = INTERVALS[Math.min(INTERVALS.length - 1, k + 1)]; r.n = dAdd(r.iv); qAdd('review', 1); note = `Помнишь. Следующий повтор через ${r.iv} ${pl(r.iv, 'день', 'дня', 'дней')}`; }
      else note = 'Помнишь, красава';
    }
    if (S.mode === 'listen') S.listenN++;
    if (S.mode === 'errors') { S.fixN++; r.e = Math.max(0, r.e - 1); }
    qAdd('correct', 1); qAdd('combo', combo, true);
    if (today().c === 10) markActive();
    sfx('ok');
  } else {
    combo = 0; r.e = (r.e || 0) + 1; buzz(110); sfx('bad');
    const pen = w.ph ? 75 : 150;
    if (r.s === 2) { r.s = 1; r.m = M / 2; r.iv = 0; r.n = ''; note = `Забыл — ${w.ph ? 'фраза вернулась' : 'слово вернулось'} в учёбу с половиной прогресса`; }
    else { r.m = Math.max(0, r.m - pen); note = (i === -1 ? 'Не успел' : 'Мимо') + ` — прогресс ${w.ph ? 'фразы' : 'слова'} −${pen}`; }
    progress = `<div class="cbar"><i style="width:${r.m / M * 100}%"></i></div>`;
  }
  addXP(gain); checkAch(); save(); renderHud();
  const xpLine = ok ? `<div class="xpline num"><span>+${Math.round(gain)} XP</span>${combo >= 3 ? `<span>комбо ${combo}</span>` : ''}</div>` : '';
  overlay(`<div class="card ${ok ? 'ok' : 'bad'}"><div class="k">${ok ? `Верно · ${pts} очков` : 'Правильный ответ'}</div>
    <div class="en${w.ph ? ' ph' : ''}">${esc(w.en)}</div><div class="ru">${esc(w.ru)}</div>${progress}<div class="hint">${esc(note)}</div>${xpLine}
    <button class="more-btn" id="moreInfo">Подробнее ${w.ph ? 'о фразе' : 'о слове'}</button>
    ${ok ? '' : '<div class="row"><button class="pill main" id="nextBtn">Дальше</button></div>'}</div>`);
  $('moreInfo').onclick = e => { e.stopPropagation(); clearTimeout(autoT); openInfo(w); };
  if (ok) { autoT = setTimeout(next, was === 1 && r.s === 2 ? 1900 : 1200); $('ov').onclick = () => { clearTimeout(autoT); next(); }; if (rev) say(w.en); }
  else { $('nextBtn').onclick = next; say(w.en); }
  function next() { $('ov').onclick = null; if (paused) return; closeOv(); step(); }
}

function clearAns() { ansBtns.forEach(b => { b.textContent = ''; b.disabled = true; b.className = 'ans'; }); $('drop').hidden = true; }

  markGpt();
  if (window.Android && Android.copy) { try { Android.copy(text); toast('Скопировано', 'ok'); return; } catch (e) {} }
  const fallback = () => { try { const t = ta || document.createElement('textarea'); if (!ta) { t.value = text; document.body.appendChild(t); } t.select(); document.execCommand('copy'); if (!ta) t.remove(); toast('Скопировано', 'ok'); } catch (e) { toast('Выдели текст и скопируй вручную'); } };
  try { navigator.clipboard.writeText(text).then(() => toast('Скопировано', 'ok'), fallback); } catch (e) { fallback(); }
}
function share(text) {
  markGpt();
  if (window.Android && Android.share) { try { Android.share(text); return; } catch (e) {} }
  try { navigator.share({ text }).catch(() => {}); } catch (e) { copy(text); }
}

function tabOpts() {
  const seg = (id, items, curV) => `<div class="seg" id="${id}">${items.map(([v, n]) => `<button data-v="${v}" class="${String(v) === String(curV) ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  $('hubBody').innerHTML = `
  <section class="block">
    <div class="flabel">Имя владельца</div>
    <input class="field-in" id="oName" maxlength="24" value="${esc(S.name)}">
    <div class="flabel">Скорость падения</div>${seg('oSpeed', SPEEDS.map((s, i) => [i, s.n]), S.speed)}
    <div class="flabel">Новых слов в день</div>${seg('oGoal', [[5, '5'], [10, '10'], [15, '15'], [20, '20'], [30, '30']], S.goal)}
    <div class="flabel">Направление</div>${seg('oDir', [['en', 'EN → RU'], ['ru', 'RU → EN'], ['mix', 'Смешанно']], S.dir)}
    <p>«Смешанно»: слова, которые ты уже наполовину знаешь, иногда падают по-русски, и надо выбрать английский вариант.</p>
  </section>
  <section class="block">
    <div class="toggle"><span>Озвучка слов</span><button class="sw ${S.sound ? 'on' : ''}" id="oSound" aria-label="Озвучка"></button></div>
    <div class="toggle"><span>Звуки игры</span><button class="sw ${S.sfx ? 'on' : ''}" id="oSfx" aria-label="Звуки"></button></div>
    <p>Если слова не озвучиваются, открой на телефоне Настройки → Синтез речи и скачай английский голос.</p>
  </section>
  <section class="block">
    <h3>Прогресс</h3>
    <p class="num">В базе ${W.length} ${pl(W.length, 'слово', 'слова', 'слов')}: выучено ${nLearned()}, в работе ${learningList().length}, уже знал ${W.filter(w => st(w.en) === 3).length}.</p>
    <button class="btn danger" id="oReset">Сбросить весь прогресс</button>
  </section>`;
  $('oName').onchange = e => { S.name = e.target.value.trim() || 'Игорь'; save(); renderHud(); };
  const bindSeg = (id, fn) => { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; fn(b.dataset.v); save(); [...$(id).children].forEach(x => x.classList.toggle('on', x === b)); }; };
  bindSeg('oSpeed', v => S.speed = +v);
  bindSeg('oGoal', v => { S.goal = +v; });
  bindSeg('oDir', v => { S.dir = v; dropCur(); });
  $('oSound').onclick = e => { S.sound = !S.sound; e.target.classList.toggle('on', S.sound); save(); };
  $('oSfx').onclick = e => { S.sfx = !S.sfx; e.target.classList.toggle('on', S.sfx); save(); };
  armed = false;
  $('oReset').onclick = () => {
    if (!armed) { armed = true; $('oReset').textContent = 'Точно? Нажми ещё раз — всё обнулится'; return; }
    S = fresh(); S.objNo = 1000 + Math.floor(Math.random() * 9000); rollDay(); save(); cur = null; combo = 0; renderHud(); fillSelects(); tab = 'home'; renderHub(); toast('Прогресс сброшен');
  };
}

/* ================= wiring ================= */
$('pauseBtn').onclick = () => openHub();
$('hudBadge').onclick = () => openHub('home');
ansBtns.forEach((b, i) => b.onclick = () => judge(i));
document.addEventListener('keydown', e => {
  if (!$('hub').hidden || !$('modal').hidden || !$('sheet').hidden) return;
  const k = '1234'.indexOf(e.key); if (k >= 0 && running) judge(k);
  if (e.key === 'Escape') openHub();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) openHub(); });
window.androidBack = () => {
  if (!$('modal').hidden) return 'stay';
  if (!$('sheet').hidden) { closeInfo(); return 'stay'; }
  if (!$('hub').hidden) { if (tab !== 'home') { tab = 'home'; renderHub(); return 'stay'; } return 'exit'; }
  openHub(); return 'menu';
};
window.androidPause = () => { if (!paused) openHub(); };

rollDay(); lastBricks = nBricks(); save(); renderHud(); openHub('home');
</script>
