name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Мозг лиса — llama.cpp (arm64)
        env:
          LLAMA_TAG: b11918
        run: |
          git clone -q --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S brain -B "$RUNNER_TEMP/bb" -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          cmake --build "$RUNNER_TEMP/bb" -j"$(nproc)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/bb/libfoxbrain.so" app/src/main/jniLibs/arm64-v8a/
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded app/src/main/jniLibs/arm64-v8a/libfoxbrain.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Slovopad-1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Slovopad-1.${{ github.run_number }}
          path: Slovopad-1.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Словопад 1.${{ github.run_number }}
          body: "Скачай APK ниже и установи на телефон. Новая версия ставится поверх старой, прогресс сохраняется."
          files: Slovopad-1.${{ github.run_number }}.apk
          make_latest: true
