name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Slovopad-1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Slovopad-1.${{ github.run_number }}
          path: Slovopad-1.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Словопад 1.${{ github.run_number }}
          body: "Скачай APK ниже и установи на телефон. Новая версия ставится поверх старой, прогресс сохраняется."
          files: Slovopad-1.${{ github.run_number }}.apk
          make_latest: true
