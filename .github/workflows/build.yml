name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: GigaChat certificates (НУЦ Минцифры)
        run: |
          d=app/src/main/res/raw
          for n in root sub; do
            f=$d/russian_trusted_${n}_ca.pem
            [ -s "$f" ] || curl -fsSL --retry 3 "https://gu-st.ru/content/lending/russian_trusted_${n}_ca_pem.crt" -o "$f" || curl -kfsSL --retry 3 "https://gu-st.ru/content/lending/russian_trusted_${n}_ca_pem.crt" -o "$f"
            openssl x509 -in "$f" -noout -subject -fingerprint -sha256
            openssl x509 -in "$f" -noout -subject | grep -q "Russian Trusted" || { echo "bad cert $n"; exit 1; }
          done
          ls -la $d

      - uses: actions/upload-artifact@v4
        with:
          name: certs
          path: app/src/main/res/raw/*.pem

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Slovopad-1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Slovopad-1.${{ github.run_number }}
          path: Slovopad-1.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Словопад 1.${{ github.run_number }}
          body: Скачай APK ниже и установи на телефон. Новая версия ставится поверх старой, прогресс сохраняется.
          files: Slovopad-1.${{ github.run_number }}.apk
          make_latest: true
